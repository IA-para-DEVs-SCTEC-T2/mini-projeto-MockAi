name: Tech
description: Template para criação de issues técnicas
title: "[TECH] "
labels: ["tech"]
type: Feature

body:
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: Descreva brevemente a tarefa técnica a ser realizada.
      placeholder: |
        Configurar pipeline de CI/CD para execução automática de testes
        e deploy no ambiente de staging.
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist técnico
      description: Liste as tarefas técnicas necessárias.
      options:
        - label: Descreva aqui a primeira tarefa técnica
        - label: Descreva aqui a segunda tarefa técnica
    validations:
      required: true
